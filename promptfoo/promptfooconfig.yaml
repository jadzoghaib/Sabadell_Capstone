description: "Qualitative characterisation of prompt variant reasoning styles (NVIDIA NIM judge)"

# ── Judge model ───────────────────────────────────────────────────────────────
# NVIDIA NIM is OpenAI-compatible. NVIDIA_API_KEY is read from .env at repo root.
# Change the model below to any NIM-hosted model if needed.
providers:
  - id: openai:chat:meta/llama-3.3-70b-instruct
    config:
      baseURL: https://integrate.api.nvidia.com/v1
      apiKey: ${NVIDIA_API_KEY}

# ── Judge prompt ──────────────────────────────────────────────────────────────
prompts:
  - file://judge_prompt.txt

# ── Test cases (one per prompt variant) ──────────────────────────────────────
# Generated by prepare_tests.py — run that script first after 05_Prompt_Variance
# has produced data/results/llm/05_reasonings.jsonl
tests:
  - file://tests.yaml

# ── Output ────────────────────────────────────────────────────────────────────
outputPath: results/qualitative_characterisations.json
