description: "Qualitative characterisation of prompt variant reasoning styles (Groq judge)"

# ── Judge model ───────────────────────────────────────────────────────────────
# Groq uses an OpenAI-compatible API. Set GROQ_API_KEY in your .env before running.
# Change the model below if you want a different Groq model.
providers:
  - id: openai:chat:llama-3.3-70b-versatile
    config:
      baseURL: https://api.groq.com/openai/v1
      apiKey: ${GROQ_API_KEY}

# ── Judge prompt ──────────────────────────────────────────────────────────────
prompts:
  - file://judge_prompt.txt

# ── Test cases (one per prompt variant) ──────────────────────────────────────
# Generated by prepare_tests.py — run that script first after 05_Prompt_Variance
# has produced data/results/llm/05_reasonings.jsonl
tests:
  - file://tests.yaml

# ── Output ────────────────────────────────────────────────────────────────────
outputPath: results/qualitative_characterisations.json
